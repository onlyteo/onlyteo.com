name: Build and Deploy to Codeberg Pages

on:
  push:
    branches:
      - pages
  schedule:
    - cron: "0 0 * * 1"

jobs:
  build_and_deploy:
    runs-on: codeberg-tiny
    env:
      HUGO_VERSION: 0.168.0
      DART_SASS_VERSION: 1.105.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: |
          wget -O ${{ runner.temp }}/dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz \
          && sudo tar -xzf ${{ runner.temp }}/dart-sass.tar.gz -C /opt \
          && sudo ln -s /opt/dart-sass/sass /usr/local/bin/sass

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install and Build
        run: npm ci && npm run build

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://onlyteo.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: dist/
